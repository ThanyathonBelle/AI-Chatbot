services:
  kubechat:
    build: .
    image: kubechat:local
    container_name: kubechat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/kubechat.sqlite3
    ports:
      # Loopback only for safety. For LAN access use 0.0.0.0:8080:8080 with APP_PASSWORD + HTTPS proxy.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kubechat_data:/app/data

volumes:
  kubechat_data:
    security_opt:
      - no-new-privileges:true
